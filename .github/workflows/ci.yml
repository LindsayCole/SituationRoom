name: Situation Room CI

on:
  push:
    branches: [ main, v2-yahoo-auth-sync-ui ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
